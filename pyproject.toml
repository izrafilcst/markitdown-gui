[project]
name = "markitdown-gui"
version = "1.0.0"
description = "Interface grafica para a biblioteca markitdown da Microsoft, 100% offline"
requires-python = ">=3.12"
dependencies = [
    "PySide6==6.11.1",
    "markitdown[pdf,docx,pptx,xlsx,xls,outlook]==0.1.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["markitdown_gui", "markitdown_gui.core", "markitdown_gui.jobs", "markitdown_gui.ui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
